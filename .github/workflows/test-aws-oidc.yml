---
name: Test AWS OIDC and SSM

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-aws-access:
    name: Verify AWS OIDC and test SSM
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 5

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: |
            arn:aws:iam::605176346086:role/SurveyBuilderTestDeployRole
          aws-region: eu-central-1
          role-session-name: GitHubTestSSM

      - name: Verify assumed AWS identity
        run: |
          aws sts get-caller-identity

      - name: Send harmless command to test EC2
        id: send-command
        env:
          INSTANCE_ID: i-044909586b2fc88e7
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "GitHub Actions OIDC connectivity test" \
            --parameters '{"commands":["whoami", "hostname"]}' \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Submitted SSM command: $COMMAND_ID"

      - name: Wait for SSm command result
        env:
          COMMAND_ID: ${{ steps.send-command.outputs.command_id }}
          INSTANCE_ID: i-044909586b2fc88e7
        run: |
          for attempt in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Attempt $attempt: ${STATUS:-Pending}"

            case "$STATUS" in
              Success)
                break
                ;;
              Failed|Cancelled|Timeout|cancelling)
                echo "SSM command ended with status: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID"
                exit 1
                ;;
            esac

            sleep 5
          done

          if [ "$STATUS" != "success" ]; then
            echo "SSM command did not succeed within the timeout."
            exit 1
          fi
      - name: Display SSM command result
        env:
          COMMAND_ID: ${{ steps.send-command.outputs.command_id}}
          INSTANCE_ID: i-044909586b2fc88e7
        run: |
          aws ssm get -command-invocation \
          --command-id "$COMMAND_ID"
          --instance-id "$INSTANCE_ID" \
          --query '{
            Status:Status,
            Output:StandardOutputContent,
            Error:StandardErrorContent}' \
          --output json
